  <circle cx="16" cy="20" r="1.8" fill="#FFFFFF"/>
  <circle cx="24" cy="20" r="1.8" fill="#38BDF8"/>

  <!-- Cluster Node B (Mirrored Replica - Blueprint Cyan) -->
