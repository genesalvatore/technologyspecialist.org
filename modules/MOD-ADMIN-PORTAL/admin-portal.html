      try {
        const curRes = await fetch(withPortalSiteKey('/data/slider-config.json?t=' + Date.now()));
        const curCfg = curRes.ok ? await curRes.json() : { autoplayMs: 5000, slides: [] };
        const rawSlides = Array.isArray(curCfg.slides) ? curCfg.slides : [];
        const wasInSlider = rawSlides.some(s => s.src === imgSrc && (!s.band || !show.band || String(s.band).toLowerCase() === String(show.band).toLowerCase()));
        const slides = rawSlides.filter(s => !(s.src === imgSrc && (!s.band || !show.band || String(s.band).toLowerCase() === String(show.band).toLowerCase())));
        if (!wasInSlider) {
          const newSlide = {
            id: 'slide-' + Date.now(),
            enabled: true,
            showId: show.id,
            src: imgSrc,
            thumb: imgSrc,
            band: show.band,
            venue: show.venue,

            link: show.page_url || ('/events/' + encodeURIComponent(show.id) + '.html'),
            cta: `VIEW ${(show.photos || []).length} SHOTS →`,
            label: `${show.band} #${photoIdx + 1}`
          };
          slides.unshift(newSlide);
        }
        await fetch('/api/mod/slider-config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ autoplayMs: 5000, slides })

        STATE.bsiHeroSlider.loaded = false;

    function initBsiReleaseWaiverInteractive() {
      if (!STATE.bsiWaiver.loaded) {
        STATE.bsiWaiver.loaded = true;
        fetch(withPortalSiteKey('/data/waivers.json?t=' + Date.now())).then(r => r.json()).then(d => {
          if (d) {
            if (d.fanTemplateBody) STATE.bsiWaiver.fanTemplateBody = d.fanTemplateBody;
            else if (d.templateBody) STATE.bsiWaiver.fanTemplateBody = d.templateBody;
            if (d.bandContractBody) STATE.bsiWaiver.bandContractBody = d.bandContractBody;
            if (d.fanFormFileName) STATE.bsiWaiver.fanFormFileName = d.fanFormFileName;
            if (d.bandContractFileName) STATE.bsiWaiver.bandContractFileName = d.bandContractFileName;
            if (Array.isArray(d.signedWaivers)) STATE.bsiWaiver.signedWaivers = d.signedWaivers;
            renderActiveTab();
          }
        }).catch(() => {});
      }
      const c = document.getElementById('admWaiverSigCanvas');
      if (!c) return;
      const ctx = c.getContext('2d');
      ctx.strokeStyle = '#F59E0B';
      ctx.lineWidth = 2.6;
      ctx.lineCap = 'round';
      let drawing = false;
      function pos(ev) {
        const r = c.getBoundingClientRect();
        const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
        const cy = ev.touches ? ev.touches[0].clientY : ev.clientY;
        return { x: (cx - r.left) * (c.width / r.width), y: (cy - r.top) * (c.height / r.height) };
      }
      c.onpointerdown = (ev) => { drawing = true; const p = pos(ev); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
      c.onpointermove = (ev) => { if (!drawing) return; const p = pos(ev); ctx.lineTo(p.x, p.y); ctx.stroke(); };
      window.addEventListener('pointerup', () => { drawing = false; });
    }

    function clearBsiAdminSigCanvas() {

          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(STATE.bsiCoffee.config)
        });
        const data = await res.json();
        if (res.ok && data && data.ok) {
          STATE.bsiCoffee.config = data.config || STATE.bsiCoffee.config;
          try {
            localStorage.setItem('bsi_coffee_updated', String(Date.now()));
            if (typeof BroadcastChannel !== 'undefined') {

            }
          } catch (e) {}
          renderActiveTab();
          showToast('☕ Saved & Published MOD-COFFEE Sponsor Tier Slider live to website!');

        }
      } catch (err) {
        showToast('Network error saving MOD-COFFEE: ' + err.message);
      }
    }

    async function loadSpokeDeepHelp() {
      const siteKey = STATE.license?.siteKey || 'backstageimagesri';
      const role = STATE.isSuperAdmin ? 'super_admin' : (STATE.deepHelpRole || 'admin');
      try {
        const [res, gateRes] = await Promise.all([
          fetch(`/api/command/deep-help?siteKey=${encodeURIComponent(siteKey)}&role=${encodeURIComponent(role)}`).catch(() => null),
          fetch(`/api/gt-sync/v1/gate/users`).catch(() =>
            fetch(`/api/command/gate/users?siteKey=${encodeURIComponent(siteKey)}`)
          )
        ]);
        let mergedUsers = [];
        if (res && res.ok) {
          const data = await res.json();
          if (data.ok) {
            STATE.deepHelpCatalog = data.catalog;
            mergedUsers = (data.appUsers || []).filter(u => u.siteKey === siteKey);
          }
        }
        if (gateRes && gateRes.ok) {
          const gData = await gateRes.json();
          if (typeof gData.previewGateEnabled === 'boolean' && STATE.backendSummary) {
            STATE.backendSummary.previewGateEnabled = gData.previewGateEnabled;
          }
          if (Array.isArray(gData.users) && gData.users.length > 0) {
            const byEmail = new Map();
            for (const u of mergedUsers) {
              byEmail.set(String(u.email || u.userId).toLowerCase(), u);
            }
            for (const gu of gData.users) {
              const key = String(gu.email || gu.id).toLowerCase();
              const existing = byEmail.get(key) || {};
              byEmail.set(key, {
                ...existing,
                userId: gu.id || existing.userId || ('usr-' + Date.now()),
                id: gu.id || existing.id,
                name: gu.name || existing.name,
                email: gu.email || existing.email,
                role: gu.role || existing.role || 'Reviewer',
                siteKey: gu.site_key || siteKey,
                active: gu.active !== false,
                pinboardAccess: gu.active !== false,
                pinboardTeamView: true,
                lastLoginAt: gu.last_login_at || null
              });
            }
            mergedUsers = Array.from(byEmail.values());
          }
        }
        STATE.appUsers = mergedUsers;
        if (STATE.activeTab === 'deep-help' || STATE.activeTab === 'app-users') renderActiveTab();
      } catch {}
    }

    function buildClientSampleMatomoData(baseData, rangeParam = '30d') {
      const base = baseData || {};
      const dom = base.domain || STATE.license?.domain || window.location.hostname || 'yourwebsite.com';
      const siteId = base.site?.idsite || 45;
      const siteName = base.siteName || base.site?.name || STATE.license?.clientName || dom;
      const daysCount = rangeParam === 'today' ? 1 : rangeParam === '7d' ? 7 : rangeParam === '90d' ? 90 : 30;
      const now = new Date();
      const dailySeries = [];
      let totalVisits = 0;
      let totalPageviews = 0;
      let totalConversions = 0;

      for (let i = daysCount - 1; i >= 0; i--) {
        const dt = new Date(now.getTime() - i * 86400000);
        const dateStr = dt.toISOString().slice(0, 10);
        const wave = Math.round(Math.sin((daysCount - i) * 0.45) * 14);
        const v = Math.max(22, 38 + ((i * 11) % 27) + wave);
        const pv = Math.max(68, v * 3 + ((i * 13) % 34));
        const conv = Math.max(1, Math.round(v * 0.032));
        totalVisits += v;
        totalPageviews += pv;
        totalConversions += conv;
        dailySeries.push({
          date: dateStr,
          visits: v,
          uniqueVisitors: Math.round(v * 0.84),
          pageviews: pv,
          conversions: conv,
          avgVisitDurationSec: 142 + ((i * 7) % 45)
        });
      }

      return {
        ...base,
        ok: true,
        demoMode: true,
        domain: dom,
        siteName,
        site: { idsite: siteId, name: siteName, mainUrl: 'https://' + dom },

      const siteKey = params.get('siteKey') || STATE.license?.siteKey || '';
      const range = STATE.matomoRange || '30d';

      // Preserve real live telemetry snapshot before switching to sample preview
      if (STATE.matomoData && !STATE.matomoData.demoMode) {
        STATE.matomoRealDataBackup = JSON.parse(JSON.stringify(STATE.matomoData));
      }
      STATE.matomoDemoOverride = wantDemo;

      if (wantDemo) {
        STATE.matomoData = buildClientSampleMatomoData(STATE.matomoRealDataBackup || STATE.matomoData, range);
      } else if (STATE.matomoRealDataBackup) {
        STATE.matomoData = JSON.parse(JSON.stringify(STATE.matomoRealDataBackup));

      } else if (STATE.matomoData) {
        STATE.matomoData.demoMode = false;

      if (pill && STATE.matomoData?.kpis) {
        pill.textContent = wantDemo ? 'SAMPLE ON' : `${STATE.matomoData.kpis.totalVisits || 0} VISITS`;
      }

      renderActiveTab();

        openMatomoSampleDataModal();
      }

      showToast(
        wantDemo
          ? '🧪 Sample Preview Mode ON  -  Dashboard is now showing simulated sample charts'
          : '🛡️ Sample Mode OFF  -  Restored 100% Real Live Matomo Telemetry'
      );

      // If turning sample mode off and we do not have a cached real backup, reload live stats from Matomo
      if (!wantDemo && !STATE.matomoRealDataBackup) {

      // Best-effort server sync (non-blocking)

    function addRecipientPillToMatomo(email) {
      const inp = document.getElementById('matomoRecipientsInput');
      if (!inp) return;
      const current = inp.value
        .split(/[,;\n]+/)
        .map((s) => s.trim().toLowerCase())
        .filter((s) => s && s.includes('@'));
      const normEmail = String(email || '').trim().toLowerCase();
      if (!normEmail) return;
      if (current.includes(normEmail)) {
        const next = current.filter((x) => x !== normEmail);
        inp.value = next.join(', ');
      } else {
        current.push(normEmail);
        inp.value = current.join(', ');
      }
      saveMatomoDigestSettings();
    }

      const inp = document.getElementById('matomoRecipientsInput');
      if (!customInp || !inp) return;
      const val = String(customInp.value || '').trim().toLowerCase();
      if (!val || !val.includes('@')) {
        showToast('⚠️ Please enter a valid email address');
        return;
      }
      const current = inp.value
        .split(/[,;\n]+/)
        .map((s) => s.trim().toLowerCase())
        .filter((s) => s && s.includes('@'));
      if (!current.includes(val)) current.push(val);
      inp.value = current.join(', ');
      customInp.value = '';
      saveMatomoDigestSettings();
    }

    async function saveMatomoDigestSettings(e) {
      if (e && e.preventDefault) e.preventDefault();
      const params = new URLSearchParams(window.location.search);
      const siteKey = params.get('siteKey') || STATE.license?.siteKey || '';
      const enabled = document.getElementById('matomoEnableChk')?.checked ?? true;
      const schedule = document.getElementById('matomoScheduleSelect')?.value || 'nightly_standalone';
      const deliveryTime = document.getElementById('matomoTimeSelect')?.value || '20:00 EST';
      const recipientsRaw = document.getElementById('matomoRecipientsInput')?.value || '';
      const includeKpis = document.getElementById('matomoIncKpis')?.checked ?? true;
      const includeTopPages = document.getElementById('matomoIncPages')?.checked ?? true;
      const includeReferrers = document.getElementById('matomoIncReferrers')?.checked ?? true;
      const includeDevicesGeo = document.getElementById('matomoIncDevices')?.checked ?? true;
      const includeGoals = document.getElementById('matomoIncGoals')?.checked ?? true;

      try {
        const res = await fetch(`/api/admin/matomo-stats?siteKey=${encodeURIComponent(siteKey)}`, {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'save_matomo_report_settings',
            enabled: schedule === 'paused' ? false : enabled,
            schedule,
            deliveryTime,
            recipients: recipientsRaw,
            includeKpis,
            includeTopPages,
            includeReferrers,
            includeDevicesGeo,
            includeGoals,
          }),
        });
        const data = await res.json();
        if (data && data.ok) {
          if (STATE.matomoData) {
            STATE.matomoData.matomoReportDigest = data.matomoReportDigest;
          }
          showToast(
            data.matomoReportDigest.enabled
              ? `✅ Nightly Matomo Email Reports active (${data.matomoReportDigest.schedule.replace(/_/g, ' ')}) -> ${(data.matomoReportDigest.recipients || []).join(', ')}`
              : '⏸️ Nightly Matomo Email Reports paused'
          );
          renderActiveTab();
        } else {
          showToast('⚠️ Failed to save Matomo report settings');
        }
      } catch (err) {
        showToast('⚠️ Error saving Matomo report settings: ' + err.message);
      }
    }

    async function sendMatomoReportNow() {
      const params = new URLSearchParams(window.location.search);
      const siteKey = params.get('siteKey') || STATE.license?.siteKey || '';
      const recipientsRaw = document.getElementById('matomoRecipientsInput')?.value || '';
      const btn = document.getElementById('btnSendMatomoReportNow');
      if (btn) {
        btn.disabled = true;
        btn.textContent = '⏳ Dispatching Matomo Report...';
      }
      try {
        const res = await fetch(`/api/admin/matomo-stats?siteKey=${encodeURIComponent(siteKey)}`, {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'send_matomo_report_now',
            range: STATE.matomoRange || '30d',
            recipients: recipientsRaw,
          }),
        });
        const data = await res.json();
        if (data && data.ok) {
          showToast(data.message || '📨 Matomo Analytics Report sent!');
          loadMatomoStats(false);
          loadDailyAuditLog(false);
        } else {
          showToast('⚠️ Could not send Matomo report: ' + (data?.error || 'Unknown error'));
        }
      } catch (err) {
        showToast('⚠️ Network error sending Matomo report: ' + err.message);
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = '📨 Send Analytics Email Report Now';
        }
      }
    }

    function exportMatomoCsv() {
      const d = STATE.matomoData;
      if (!d || !d.dailySeries) {
        showToast('No Matomo data loaded yet.');
        return;
      }
      const rows = [['Date', 'Total Visits', 'Unique Visitors', 'Pageviews', 'Goal Conversions']];
      for (const day of d.dailySeries) {
        rows.push([day.date, day.visits, day.uniqueVisitors, day.pageviews, day.conversions]);
      }
      const csv = rows.map((r) => r.map((v) => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${d.siteKey || 'site'}-matomo-analytics-${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function fmtDate(ts) {
      if (!ts) return ' - ';
      const d = new Date(String(ts).replace(' ', 'T'));
      return isNaN(d.getTime()) ? String(ts) : d.toLocaleString();
    }

    function formatDurationHuman(sec) {
      const s = Math.max(0, Number(sec || 0));
      const m = Math.floor(s / 60);
      const rem = Math.round(s % 60);
      return m > 0 ? `${m}m ${rem}s` : `${rem}s`;
    }

    async function loadDailyAuditLog(silent = false) {
      if (STATE.dailyAuditLoading) return;
      STATE.dailyAuditLoading = true;
      const params = new URLSearchParams(window.location.search);
      const siteKey = params.get('siteKey') || STATE.license?.siteKey || '';
      const url = siteKey ? `/api/admin/daily-audit-log?siteKey=${encodeURIComponent(siteKey)}` : '/api/admin/daily-audit-log';
      try {
        const res = await fetch(url, { credentials: 'same-origin' });
        const data = await res.json();
        if (data && data.ok) {
          STATE.dailyAuditData = data;
          const pill = document.getElementById('navAuditPill');
          if (pill && data.totals) {
            pill.textContent = `${data.totals.totalEntries || 0} LOGS`;
          }
        }
      } catch (err) {
        if (!silent) showToast('Could not load Daily Audit Log: ' + err.message);
      } finally {
        STATE.dailyAuditLoading = false;
        if (STATE.activeTab === 'daily-audit') renderActiveTab();
        else if (STATE.activeTab === 'overview' && !silent) renderActiveTab();
      }
    }

    function toggleQuickDigestRecipientEmail(emailAddr) {
      const inp = document.getElementById('digestRecipientsInput');
      if (!inp || !emailAddr) return;
      const target = String(emailAddr).trim().toLowerCase();
      const current = inp.value
        .split(/[;,\s]+/)
        .map(s => s.trim().toLowerCase())
        .filter(s => s.includes('@'));
      const idx = current.indexOf(target);
      if (idx >= 0) {
        if (current.length > 1) current.splice(idx, 1);
      } else {
        current.push(target);
      }
      inp.value = current.join(', ');
    }

    function addCustomDigestEmailFromBox() {
      const addInp = document.getElementById('digestAddEmailBox');
      const mainInp = document.getElementById('digestRecipientsInput');
      if (!addInp || !mainInp) return;
      const candidate = (addInp.value || '').trim().toLowerCase();
      if (!candidate || !candidate.includes('@')) {
        showToast('Please enter a valid email address');
        return;
      }
      const current = mainInp.value
        .split(/[;,\s]+/)
        .map(s => s.trim().toLowerCase())
        .filter(s => s.includes('@'));
      if (!current.includes(candidate)) {
        current.push(candidate);
      }
      mainInp.value = current.join(', ');
      addInp.value = '';
      showToast(`✓ Added ${candidate} to Digest Recipients (Click Save to persist)`);
    }

    async function saveNightlyDigestSettings(e) {
      if (e) e.preventDefault();
      const schedule = document.getElementById('digestScheduleSelect')?.value || 'smart_nightly';
      const toggleChecked = Boolean(document.getElementById('digestEnabledToggle')?.checked);
      const enabled = schedule === 'paused' ? false : toggleChecked;
      const deliveryTime = document.getElementById('digestTimeSelect')?.value || '20:00 EST';
      const recipientsRaw = document.getElementById('digestRecipientsInput')?.value || '';
      const includePins = Boolean(document.getElementById('digestIncPins')?.checked);
      const includeBackend = Boolean(document.getElementById('digestIncBackend')?.checked);
      const includeLeads = Boolean(document.getElementById('digestIncLeads')?.checked);
      const includeSecurity = Boolean(document.getElementById('digestIncSecurity')?.checked);

      try {
        const res = await fetch('/api/admin/daily-audit-log', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'save_digest_settings',
            nightlyDigest: {
              enabled,
              schedule,
              deliveryTime,
              recipients: recipientsRaw,
              includePins,
              includeBackend,
              includeLeads,
              includeSecurity
            }
          })
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          if (STATE.dailyAuditData) STATE.dailyAuditData.nightlyDigest = data.nightlyDigest;
          showToast('✓ ' + (data.message || 'Agent Email Digest settings saved'));
          renderActiveTab();
        } else {
          showToast('× ' + (data.error || 'Failed to save digest settings'));
        }
      } catch (err) {
        showToast('Error saving digest settings: ' + err.message);
      }
    }

    async function sendTestNightlyDigestNow() {
      const recipientsRaw = document.getElementById('digestRecipientsInput')?.value || '';
      const recipients = recipientsRaw.split(/[;,\s]+/).map(s => s.trim()).filter(s => s.includes('@'));
      if (recipients.length === 0) {
        showToast('Please enter at least one recipient email address');
        return;
      }
      showToast(`${STATE.agentIcon || getSiteAgentIdentity().icon} Dispatching Work Digest to ${recipients.join(', ')}...`);
      try {
        const res = await fetch('/api/admin/daily-audit-log', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'send_test_digest',
            recipients
          })
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          if (data.audit) {
            STATE.dailyAuditData = data.audit;
          } else if (STATE.dailyAuditData && STATE.dailyAuditData.nightlyDigest) {
            STATE.dailyAuditData.nightlyDigest.lastSentAt = data.lastSentAt;
            STATE.dailyAuditData.nightlyDigest.recipients = recipients;
          }
          showToast('✅ ' + (data.message || ((STATE.agentIcon || getSiteAgentIdentity().icon) + ' Digest Email sent!')));
          renderActiveTab();
        } else {
          showToast('× ' + (data.error || 'Failed to send test digest'));
        }
      } catch (err) {
        showToast('Error sending test digest: ' + err.message);
      }
    }

        const res = await fetch('/api/admin/daily-audit-log', {
          method: 'POST',

            action: 'ingest_email_tasks',
            from,
            subject,
            pagePath,
            bodyText,
            sendConfirmationEmail: true
          })
        });

        if (res.ok && data.ok) {
          if (data.audit) STATE.dailyAuditData = data.audit;
          if (Array.isArray(data.createdPins) && data.createdPins.length > 0) {
            STATE.pins = [...data.createdPins, ...(STATE.pins || [])];

    async function requestAuditItemRollback(encodedTitle, encodedPath) {
      const title = decodeURIComponent(encodedTitle || '');
      const pagePath = decodeURIComponent(encodedPath || '/');
      const reason = window.prompt(`Request a tweak or rollback for:\n"${title}"\n\nDescribe what you would like adjusted or reverted:`, 'Please adjust or revert this change.');
      if (!reason) return;
      try {
        const res = await fetch('/api/admin/daily-audit-log', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'request_rollback',
            title,
            pagePath,
            reason,
            author: STATE.currentUser?.name || 'Customer Console Admin'
          })
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          if (data.pin) STATE.pins.unshift(data.pin);

          showToast('✅ ' + (data.message || 'Rollback / Tweak Pin queued for your agent!'));

        showToast('Error submitting rollback request: ' + err.message);

    function exportMonthlyAuditCsv() {
      const audit = STATE.dailyAuditData;
      if (!audit || !Array.isArray(audit.days)) {
        showToast('No audit data loaded yet');
        return;
      }
      const rows = [['Date', 'Timestamp', 'Category', 'Title', 'Details', 'Page Path', 'Agent / Engineer', 'Commit / Pin', 'Est. Hours']];
      audit.days.forEach(d => {
        (d.entries || []).forEach(e => {
          rows.push([
            d.dateKey,
            e.timestamp || '',
            e.categoryLabel || e.category || '',
            (e.title || '').replace(/"/g, '""'),
            (e.details || '').replace(/"/g, '""'),
            e.pagePath || '/',
            e.author || '',
            e.commitHash || (e.pinNumber ? '#' + e.pinNumber : ''),
            String(e.hoursEstimated || 0.25)
          ]);
        });
      });
      const csv = rows.map(r => r.map(c => `"${c}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${(STATE.license?.domain || 'site').replace(/[^a-z0-9.-]/gi, '_')}_daily_work_audit_report.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast('📄 Downloaded Monthly Work & Audit CSV Report');
    }

    async function addAuthorizedSenderEmail(e) {
      if (e) e.preventDefault();
      const emailEl = document.getElementById('newAuthSenderEmail');
      const nameEl = document.getElementById('newAuthSenderName');
      const email = (emailEl?.value || '').trim().toLowerCase();
      const name = (nameEl?.value || 'Authorized Owner / Team Sender').trim();
      if (!email || !email.includes('@')) {
        showToast('Please enter a valid email address');
        return;
      }
      try {
        let savedViaApi = false;
        try {
          const res = await fetch('/api/admin/authorized-emails', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, name, role: 'Owner / Team' })
          });
          if (res.ok) {
            const data = await res.json();
            if (data && data.ok) {
              STATE.authorizedAgentEmails = data.authorizedAgentEmails || [];
              savedViaApi = true;
            }
          }
        } catch {}
        if (!savedViaApi) {
          STATE.authorizedAgentEmails = (STATE.authorizedAgentEmails || []).filter(x => String(x.email || '').toLowerCase() !== email);
          STATE.authorizedAgentEmails.push({ email, name, role: 'Owner / Team' });
        }
        if (emailEl) emailEl.value = '';
        if (nameEl) nameEl.value = '';
        showToast(`✓ Authorized ${email} to email instructions to ${STATE.agentHandle || getSiteAgentIdentity().handle}`);
        renderActiveTab();
      } catch (err) {
        showToast('Error saving authorized email: ' + err.message);
      }
    }

    async function removeAuthorizedSenderEmail(email) {
      if (!email) return;
      try {
        let removedViaApi = false;
        try {
          const res = await fetch('/api/admin/authorized-emails', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          if (res.ok) {
            const data = await res.json();
            if (data && data.ok) {
              STATE.authorizedAgentEmails = data.authorizedAgentEmails || [];
              removedViaApi = true;
            }
          }
        } catch {}
        if (!removedViaApi) {
          STATE.authorizedAgentEmails = (STATE.authorizedAgentEmails || []).filter(x => String(x.email || '').toLowerCase() !== String(email).toLowerCase());
        }
        showToast(`🗑️ Removed ${email} from authorized agent senders`);
        renderActiveTab();
      } catch (err) {
        showToast('Error removing authorized email: ' + err.message);
      }
    }

        const visibleFavItems = favs.map(tabId => {
          const mainBtn = document.querySelector(`.navGroup:not(#navGroup-favorites) .navBtn[data-tab="${tabId}"]`);
          if (!mainBtn || mainBtn.style.display === 'none') return null;
          const catItem = SIDEBAR_TOOL_CATALOG.find(x => x.tab === tabId);
          const spanText = mainBtn.querySelector('span')?.textContent || (catItem ? catItem.label : tabId);
          return { tab: tabId, label: spanText };
        }).filter(Boolean);

        if (visibleFavItems.length === 0) {

    function filterSidebarNav(query) {
      const q = String(query || '').trim().toLowerCase();
      const groups = document.querySelectorAll('#sidebarNavScroll .navGroup');
      groups.forEach(grp => {
        if (grp.id === 'navGroup-favorites' && q) {
          grp.style.display = 'none';
          return;
        }
        const btns = Array.from(grp.querySelectorAll('.navBtn'));
        let matchCount = 0;
        btns.forEach(b => {
          // Respect module-level hiding stored in dataset if needed
          const text = (b.textContent || '').toLowerCase();
          const tab = (b.getAttribute('data-tab') || '').toLowerCase();
          if (!q) {
            b.style.removeProperty('opacity');
            if (b.dataset.searchHidden === '1') {
              b.style.display = 'flex';
              delete b.dataset.searchHidden;
            }
            if (b.style.display !== 'none') matchCount++;
          } else {
            if (b.style.display === 'none' && b.dataset.searchHidden !== '1') return;
            if (text.includes(q) || tab.includes(q)) {
              if (b.dataset.searchHidden === '1') {
                b.style.display = 'flex';
                delete b.dataset.searchHidden;
              }
              matchCount++;
            } else {
              b.dataset.searchHidden = '1';
              b.style.display = 'none';
            }
          }
        });
        if (q && matchCount > 0) {
          grp.classList.remove('collapsed');
          grp.style.display = 'block';
        } else if (q && matchCount === 0) {
          grp.style.display = 'none';
        }
      });
      if (!q) {
        restoreNavGroups();
        renderSidebarFavoritesAndCounts();
      }
    }

        async function crawlRealSpokeDomAndSitemap() {
      const lic = STATE.license || {};
      const titleMap = new Map();
      const discoveredSet = new Set(['/']);
      let parsedMegaTabs = [];

      const cleanLinkText = (str) => String(str || '').replace(/[→↗▾▼]/g, '').replace(/\s+/g, ' ').trim();
      const humanizeSlug = (p) => {
        const segs = String(p || '/').split('/').filter(Boolean);
        if (!segs.length) return (lic.siteName || 'Homepage') + '  -  Home';
        return segs[segs.length - 1]
          .replace(/\.html?$/i, '')
          .replace(/[-_]+/g, ' ')
          .replace(/\b\w/g, c => c.toUpperCase());
      };
      const isIgnoredPath = (pathname) => {
        if (!pathname || !pathname.startsWith('/')) return true;
        const low = pathname.toLowerCase();
        if (low === '/admin' || low.startsWith('/admin/') || low === '/gate' || low.startsWith('/gate/') || low.startsWith('/api/') || low.startsWith('/assets/') || low.startsWith('/uploads/') || low.startsWith('/_astro/')) return true;
        if (/\.(jpg|jpeg|png|webp|gif|svg|ico|css|js|mjs|json|pdf|zip|mp4|webm|woff2?)$/i.test(low)) return true;
        return false;
      };

      titleMap.set('/', (lic.siteName || 'Website') + '  -  Home');

      // 1. Fetch live customer homepage HTML and parse real links + real MegaMenu
      try {
        const homeRes = await fetch('/', { credentials: 'same-origin' });
        if (homeRes.ok) {
          const homeHtml = await homeRes.text();
          const doc = new DOMParser().parseFromString(homeHtml, 'text/html');

          // Extract show-card titles if present
          doc.querySelectorAll('.show-card-4k, [data-show-id]').forEach(card => {
            const a = card.querySelector('a[href]');
            const band = cleanLinkText(card.querySelector('.show-band-name, h3, h4')?.textContent || '');
            const venue = cleanLinkText(card.querySelector('.show-venue-line')?.textContent || '');
            if (a && band) {
              try {
                const u = new URL(a.getAttribute('href'), window.location.origin);
                if (u.origin === window.location.origin && !isIgnoredPath(u.pathname)) {
                  discoveredSet.add(u.pathname);
                  titleMap.set(u.pathname, venue ? (band + ' · ' + venue.split('·')[0].trim()) : band);
                }
              } catch {}
            }
          });

          // Extract all internal <a href> links from the live customer homepage
          doc.querySelectorAll('a[href]').forEach(a => {
            const rawHref = (a.getAttribute('href') || '').trim();
            if (!rawHref || rawHref.startsWith('#') || rawHref.startsWith('mailto:') || rawHref.startsWith('tel:') || rawHref.startsWith('javascript:')) return;
            try {
              const u = new URL(rawHref, window.location.origin);
              if (u.origin !== window.location.origin) return;
              const pathname = u.pathname || '/';
              if (isIgnoredPath(pathname)) return;
              discoveredSet.add(pathname);

              const megaTitleEl = a.querySelector('.bsi-mega-link-title');
              const megaSubEl = a.querySelector('.bsi-mega-link-sub');
              let candidateTitle = megaTitleEl ? cleanLinkText(megaTitleEl.textContent) : cleanLinkText(a.textContent);
              if (candidateTitle && candidateTitle.length >= 3 && candidateTitle.length <= 75 && !/^(view|open|enter|explore|read more|learn more|book online)/i.test(candidateTitle)) {
                if (!titleMap.has(pathname)) {
                  titleMap.set(pathname, candidateTitle);
                }
              }
            } catch {}
          });

          // Extract real MegaMenu structure from .nav-menu > .nav-item or header nav
          const navItems = Array.from(doc.querySelectorAll('.nav-menu > .nav-item, header nav > ul > li'));
          if (navItems.length > 0) {
            navItems.forEach((li, tIdx) => {
              const topLink = li.querySelector(':scope > a, .nav-link');
              const topSpan = topLink?.querySelector('span');
              const tabLabel = cleanLinkText(topSpan ? topSpan.textContent : (topLink ? topLink.textContent : 'Menu ' + (tIdx + 1)));
              if (!tabLabel) return;
              const megaBox = li.querySelector('.bsi-mega-menu, .mega-menu');
              if (megaBox) {
                const colDivs = Array.from(megaBox.children).filter(el => !el.classList.contains('bsi-mega-focus-card'));
                const columns = [];
                colDivs.forEach((colDiv, cIdx) => {
                  const headEl = colDiv.querySelector('.bsi-mega-col-head, h4, h5');
                  let colTitle = 'Column ' + (cIdx + 1);
                  if (headEl) {
                    const clone = headEl.cloneNode(true);
                    clone.querySelectorAll('.bsi-mega-badge').forEach(b => b.remove());
                    colTitle = cleanLinkText(clone.textContent) || colTitle;
                  }
                  const links = Array.from(colDiv.querySelectorAll('a[href]'));
                  const items = links.map((lnk, iIdx) => {
                    const tEl = lnk.querySelector('.bsi-mega-link-title');
                    const sEl = lnk.querySelector('.bsi-mega-link-sub');
                    const lbl = cleanLinkText(tEl ? tEl.textContent : lnk.textContent) || humanizeSlug(lnk.getAttribute('href'));
                    const rawH = lnk.getAttribute('href') || '/';
                    return {
                      id: 'mm-' + tIdx + '-' + cIdx + '-' + iIdx,
                      label: lbl,
                      href: rawH,
                      desc: sEl ? cleanLinkText(sEl.textContent) : '',
                      highlight: 'standard',
                      visible: true
                    };
                  });
                  if (items.length > 0) {
                    columns.push({ title: colTitle, items });
                  }
                });
                if (columns.length > 0) {
                  parsedMegaTabs.push({
                    id: 'tab-' + tIdx,
                    label: tabLabel,
                    visible: true,
                    mode: 'megamenu',
                    directHref: topLink?.getAttribute('href') || '/',
                    highlight: 'standard',
                    columns
                  });
                }
              } else if (topLink) {
                parsedMegaTabs.push({
                  id: 'tab-' + tIdx,
                  label: tabLabel,
                  visible: true,
                  mode: 'direct_link',
                  directHref: topLink.getAttribute('href') || '/',
                  highlight: 'standard',
                  columns: []
                });
              }
            });
          } else {
            // Standard header nav links fallback
            const headerLinks = Array.from(doc.querySelectorAll('header nav a[href], header a[href]')).filter(a => {
              const h = a.getAttribute('href') || '';
              return h.startsWith('/') && !isIgnoredPath(h) && cleanLinkText(a.textContent).length > 1;
            });
            const seenHrefs = new Set();
            headerLinks.slice(0, 6).forEach((lnk, idx) => {
              const h = lnk.getAttribute('href') || '/';
              if (seenHrefs.has(h)) return;
              seenHrefs.add(h);
              parsedMegaTabs.push({
                id: 'tab-' + idx,
                label: cleanLinkText(lnk.textContent),
                visible: true,
                mode: 'direct_link',
                directHref: h,
                highlight: 'standard',
                columns: []
              });
            });
          }
        }
      } catch {}

      // 2. Also merge /sitemap.xml if it returns valid XML <loc> entries
      try {
        const smRes = await fetch('/sitemap.xml', { credentials: 'same-origin' });
        if (smRes.ok) {
          const smXml = await smRes.text();
          if (smXml.includes('<loc>') && (smXml.includes('<urlset') || smXml.includes('<sitemapindex'))) {
            const locs = Array.from(smXml.matchAll(/<loc>([^<]+)<\/loc>/gi)).map(m => {
              try { return new URL(m[1].trim()).pathname; } catch { return m[1].trim(); }
            }).filter(p => !isIgnoredPath(p));
            locs.forEach(p => discoveredSet.add(p));
          }
        }
      } catch {}

      const discoveredPaths = Array.from(discoveredSet);

      const isSearchOrAiGovernanceRoute = (clean) => {
        const low = String(clean || '').toLowerCase();
        return (
          low === '/ai.txt' ||
          low === '/llms.txt' ||
          low === '/llms-full.txt' ||
          low === '/sitemap.xml' ||
          low === '/robots.txt' ||
          low === '/security.txt' ||
          low === '/.well-known/security.txt' ||
          low === '/si.txt'
        );
      };

      // Always ensure /sitemap.xml, /robots.txt, /llms.txt, /ai.txt are represented as Required Search & AI Governance tools
      ['/sitemap.xml', '/robots.txt', '/llms.txt', '/ai.txt'].forEach(govPath => {
        discoveredSet.add(govPath);
      });
      if (!titleMap.has('/sitemap.xml')) titleMap.set('/sitemap.xml', 'XML Search Sitemap (/sitemap.xml)');
      if (!titleMap.has('/robots.txt')) titleMap.set('/robots.txt', 'Search Crawler Directives (/robots.txt)');
      if (!titleMap.has('/llms.txt')) titleMap.set('/llms.txt', 'AI Authority Manifest (/llms.txt)');
      if (!titleMap.has('/ai.txt')) titleMap.set('/ai.txt', 'Crawler Governance (/ai.txt)');

      const finalDiscoveredPaths = Array.from(discoveredSet);

      const classifyPageGroup = (clean) => {
        const low = clean.toLowerCase();
        if (isSearchOrAiGovernanceRoute(low)) {
          return '1. Core, Compliance & Search/AI Governance Pages (Required)';
        }
        if (low === '/' || low.includes('contact') || low.includes('privacy') || low.includes('terms') || low.includes('about') || low.includes('login') || low.includes('book-john')) {
          return '1. Core, Compliance & Search/AI Governance Pages (Required)';
        }
        if (low.startsWith('/gallery/') || low.startsWith('/events/')) {
          return '2. Show Galleries & Event Vaults';
        }
        if (low.includes('providence') || low.includes('boston') || low.includes('worcester') || low.includes('connecticut') || low.includes('corridor') || low.includes('service-area') || low.includes('town')) {
          return '3. Regional Venues & Service Corridors';
        }
        const segs = clean.split('/').filter(Boolean);
        if (segs.length > 1) {
          return '2. ' + segs[0].replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase()) + ' Pages';
        }
        return '2. Primary Website Pages';
      };

      const pages = finalDiscoveredPaths.map((p) => {
        const clean = p === '/' ? '/' : (p.startsWith('/') ? p : '/' + p);
        const segs = clean.split('/').filter(Boolean);
        const depth = clean === '/' ? 0 : Math.min(2, segs.length);
        const low = clean.toLowerCase();
        const isSearchTool = isSearchOrAiGovernanceRoute(low);
        const isLocked = clean === '/' || isSearchTool || low.includes('contact') || low.includes('privacy') || low.includes('terms');
        const slugTitle = titleMap.get(clean) || humanizeSlug(clean);
        const group = classifyPageGroup(clean);
        const parentPath = '/';
        return {
          path: clean,
          title: slugTitle,
          group,
          depth,
          parentPath,
          active: true,
          locked: isLocked,
          isSearchGovernance: isSearchTool,
          lockReason: isSearchTool
            ? 'Search & AI Index Tool (Auto-Updated When Pages Move to 301 · Unchanged During 302)'
            : (isLocked ? 'Core / Compliance Route' : ''),
          redirectTo: '/',
          redirectMode: '302_to_301_30d',
          runtimeRedirect: { statusCode: 200, daysRemaining: 30 }
        };
      });

      // Sort pages cleanly by group then depth then path
      pages.sort((a, b) => {
        if (a.path === '/') return -1;
        if (b.path === '/') return 1;
        const gCmp = String(a.group).localeCompare(String(b.group));
        if (gCmp !== 0) return gCmp;
        return a.path.localeCompare(b.path);
      });

      if (parsedMegaTabs.length === 0) {
        parsedMegaTabs = [
          {
            id: 'tab-main',
            label: 'Website Navigation',
            visible: true,
            mode: 'megamenu',
            highlight: 'standard',
            columns: [
              {
                title: 'Core Pages',
                items: pages.slice(0, 6).map((pg, i) => ({
                  id: 'mm-1-' + i,
                  label: pg.title,
                  href: pg.path,
                  highlight: 'standard',
                  visible: true
                }))
              },
              {
                title: 'Featured Pages',
                items: pages.slice(6, 12).map((pg, i) => ({
                  id: 'mm-2-' + i,
                  label: pg.title,
                  href: pg.path,
                  highlight: 'standard',
                  visible: true
                }))
              }
            ]
          }
        ];
      }

      return {
        activePreset: 'full_catalog',
        defaultRedirectMode: '302_to_301_30d',
        pages,
        megaMenu: {
          tabs: parsedMegaTabs
        }
      };
    }

    function getSiteTreeApiEndpoint() {
      const params = new URLSearchParams(window.location.search || '');
      const siteKey = params.get('siteKey') || STATE.license?.siteKey || '';
      return siteKey ? `/api/admin/site-tree?siteKey=${encodeURIComponent(siteKey)}` : '/api/admin/site-tree';
    }

    async function buildFallbackSiteTreeForSpoke(forceFresh = false) {
      const lic = STATE.license || {};
      const dom = lic.domain || window.location.hostname || 'site.com';
      const storageKey = 'gt_site_tree_cfg_v6_' + dom;
      try {
        // Purge legacy v1..v5 cached keys
        ['v1', 'v2', 'v3', 'v4', 'v5'].forEach(v => localStorage.removeItem('gt_site_tree_cfg_' + v + '_' + dom));
        if (!forceFresh) {
          const saved = JSON.parse(localStorage.getItem(storageKey) || 'null');
          if (saved && Array.isArray(saved.pages) && saved.pages.length >= 8) {
            return saved;
          }
        }
      } catch {}

      const cfg = await crawlRealSpokeDomAndSitemap();
      try { localStorage.setItem(storageKey, JSON.stringify(cfg)); } catch {}
      return cfg;
    }

    async function loadSiteTreeData(forceFresh = false) {
      if (STATE.siteTreeLoading) return;
      STATE.siteTreeLoading = true;
      const endpoint = getSiteTreeApiEndpoint() + (forceFresh ? (getSiteTreeApiEndpoint().includes('?') ? '&refresh=1' : '?refresh=1') : '');
      const dom = STATE.license?.domain || window.location.hostname || 'site.com';
      try {
        ['v1', 'v2', 'v3', 'v4', 'v5'].forEach(v => { try { localStorage.removeItem('gt_site_tree_cfg_' + v + '_' + dom); } catch {} });
        const res = await fetch(endpoint, { credentials: 'same-origin' });
        if (res.ok) {
          const data = await res.json();

    async function applySiteTreePreset(presetId) {
      try {
        const res = await fetch(getSiteTreeApiEndpoint(), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ action: 'apply_preset', preset: presetId })
        });
        if (res.ok) {
          const data = await res.json();
          if (data && data.ok && data.config) {
            STATE.siteTreeConfig = data.config;
            updateSiteTreePill();
            renderActiveTab();
            showToast(`✓ Applied Website Size Preset (${presetId})`);
            return;
          }
        }
      } catch (e) {}

      // Client-side preset application for spokes using live DOM tree
      if (!STATE.siteTreeConfig || !Array.isArray(STATE.siteTreeConfig.pages)) return;
      const pages = STATE.siteTreeConfig.pages;
      const essentialLimit = Math.min(pages.length, Math.max(5, Math.round(pages.length * 0.35)));
      const standardLimit = Math.min(pages.length, Math.max(essentialLimit + 2, Math.round(pages.length * 0.65)));
      pages.forEach((p, idx) => {
        if (p.locked) {
          p.active = true;
        } else if (presetId === 'full_catalog') {
          p.active = true;
        } else if (presetId === 'essential_9') {
          p.active = idx < essentialLimit;
        } else if (presetId === 'standard_18') {
          p.active = idx < standardLimit;
        }
      });
      STATE.siteTreeConfig.activePreset = presetId;
      await saveSiteTreeFullConfig(`✓ Applied Website Size Preset across ${pages.length} Pages`);
    }

      if (!page || page.locked) return;

      if (!page.active && !page.redirectTo) {
        page.redirectTo = page.parentPath || '/';
      }
      if (!page.active && !page.redirectMode) {
        page.redirectMode = STATE.siteTreeConfig.defaultRedirectMode || '302_to_301_30d';
      }
      STATE.siteTreeConfig.activePreset = 'custom';
      saveSiteTreeFullConfig(
        page.active
          ? `✓ Reactivated ${page.path} (Removed Redirect · Restored HTTP 200 OK)`
          : `✓ Hidden ${page.path} → 302 Grace Period Redirect to ${page.redirectTo}`
      );
    }

    function updatePageRedirectTarget(pagePath, newTarget) {

    function selectMegaTab(tabIdx) {

      if (tabIdx < 0 || tabIdx >= tabs.length) tabIdx = 0;
      STATE.selectedMegaTabIdx = tabIdx;

    function updateMegaTabField(tabIdx, field, val) {
      const tabs = STATE.siteTreeConfig?.megaMenu?.tabs;
      if (!tabs || !tabs[tabIdx]) return;
      tabs[tabIdx][field] = val;
    }

    function moveMegaTab(tabIdx, dir) {
      const tabs = STATE.siteTreeConfig?.megaMenu?.tabs;
      if (!tabs) return;
      const targetIdx = tabIdx + dir;
      if (targetIdx < 0 || targetIdx >= tabs.length) return;
      const tmp = tabs[tabIdx];
      tabs[tabIdx] = tabs[targetIdx];
      tabs[targetIdx] = tmp;
      STATE.selectedMegaTabIdx = targetIdx;
      saveSiteTreeFullConfig("✓ Moved \"" + tmp.label + "\" in Top Menu Bar");
    }

    function addNewMegaColumn(tabIdx) {
      const tab = STATE.siteTreeConfig?.megaMenu?.tabs?.[tabIdx];

      tab.columns = Array.isArray(tab.columns) ? tab.columns : [];
      if (tab.columns.length >= 3) {
        showToast("Usability Guardrail: Maximum 3 columns per dropdown menu so it fits cleanly on all screens.");
        return;

      tab.columns.push({
        id: "col-" + Date.now(),

      });

    function removeMegaColumn(tabIdx, colIdx) {
      const tab = STATE.siteTreeConfig?.megaMenu?.tabs?.[tabIdx];
      if (!tab || !Array.isArray(tab.columns) || tab.columns.length <= 1) {
        showToast("A dropdown menu needs at least 1 column (or switch this button to Go to One Page).");
        return;
      }
      const removed = tab.columns[colIdx];
      if (removed && Array.isArray(removed.items) && removed.items.length > 0) {
        const targetColIdx = colIdx === 0 ? 1 : 0;
        if (tab.columns[targetColIdx]) {
          tab.columns[targetColIdx].items = (tab.columns[targetColIdx].items || []).concat(removed.items);
        }
      }
      tab.columns.splice(colIdx, 1);

    }

    function stepMegaItemColumn(tabIdx, colIdx, itemIdx, colDir) {
      const tab = STATE.siteTreeConfig?.megaMenu?.tabs?.[tabIdx];
      if (!tab || !Array.isArray(tab.columns)) return;
      const targetColIdx = colIdx + colDir;
      if (targetColIdx < 0 || targetColIdx >= tab.columns.length) return;
      moveMegaItemToColumn(tabIdx, colIdx, itemIdx, tabIdx + ":" + targetColIdx);
    }

    function onMegaItemDragStart(ev, tabIdx, colIdx, itemIdx) {
      STATE.megaDragState = { tabIdx, colIdx, itemIdx };
      if (ev && ev.dataTransfer) {
        ev.dataTransfer.effectAllowed = "move";
        try { ev.dataTransfer.setData("text/plain", tabIdx + ":" + colIdx + ":" + itemIdx); } catch (e) {}
      }
    }

    function onMegaColDragOver(ev) {
      if (ev) {
        ev.preventDefault();
        if (ev.dataTransfer) ev.dataTransfer.dropEffect = "move";
      }
    }

    function onMegaColDrop(ev, toTabIdx, toColIdx, toItemIdx) {
      if (ev) ev.preventDefault();
      const st = STATE.megaDragState;
      STATE.megaDragState = null;
      if (!st) return;
      const tabs = STATE.siteTreeConfig?.megaMenu?.tabs;
      if (!tabs) return;
      const srcItems = tabs[st.tabIdx]?.columns?.[st.colIdx]?.items;
      const dstItems = tabs[toTabIdx]?.columns?.[toColIdx]?.items;
      if (!srcItems || !dstItems || !srcItems[st.itemIdx]) return;
      const [moved] = srcItems.splice(st.itemIdx, 1);
      if (typeof toItemIdx === "number" && toItemIdx >= 0 && toItemIdx <= dstItems.length) {
        dstItems.splice(toItemIdx, 0, moved);
      } else {
        dstItems.push(moved);
      }
      saveSiteTreeFullConfig("✓ Moved \"" + moved.label + "\" to " + (tabs[toTabIdx].columns[toColIdx].title || "Column"));
    }

    function moveMegaItemToColumn(fromTabIdx, fromColIdx, itemIdx, destKey) {
      const tabs = STATE.siteTreeConfig?.megaMenu?.tabs;
      if (!tabs) return;
      const [toTabIdxStr, toColIdxStr] = String(destKey).split(":");
      const toTabIdx = Number(toTabIdxStr);
      const toColIdx = Number(toColIdxStr);
      if (fromTabIdx === toTabIdx && fromColIdx === toColIdx) return;
      const srcItems = tabs[fromTabIdx]?.columns?.[fromColIdx]?.items;
      const dstItems = tabs[toTabIdx]?.columns?.[toColIdx]?.items;
      if (!srcItems || !dstItems || !srcItems[itemIdx]) return;
      const [moved] = srcItems.splice(itemIdx, 1);
      dstItems.push(moved);
      saveSiteTreeFullConfig("✓ Moved \"" + moved.label + "\" to " + tabs[toTabIdx].label + " → " + tabs[toTabIdx].columns[toColIdx].title);
    }

      if (!col || !page) return;
      col.items = col.items || [];
      col.items.push({

        contract_badge: { pill: "⚡ SPOTLIGHT", label: "⚡ Spotlight", bg: "#eff6ff", fg: "#1d4ed8", border: "#93c5fd" },
        emergency_amber: { pill: "🚨 URGENT", label: "🚨 Urgent", bg: "#fef2f2", fg: "#b91c1c", border: "#fca5a5" }

                </table>
              </div>
            </div>
          `).join('')}
        ` : `
          <!-- MEGAMENU & NAVIGATION MANAGER SUB-VIEW -->
          ${renderMegaMenuStudioSubView(cfg, pages, activePages)}
        `}
      `;
    }
