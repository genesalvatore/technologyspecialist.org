<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" fill="none" style="background:#0F172A;">
  <defs>
    <pattern id="grid-rack" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="500" height="700" fill="url(#grid-rack)"/>

  <!-- Telemetry Header -->
  <rect x="20" y="20" width="460" height="32" fill="#1E293B" rx="1"/>
  <text x="35" y="41" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#38BDF8">SYS-08 // 42U ENTERPRISE RACK ELEVATION</text>
  <circle cx="465" cy="36" r="4" fill="#10B981"/>

  <!-- 42U Rack Outer Frame -->
  <rect x="70" y="70" width="360" height="600" fill="#090E17" stroke="#475569" stroke-width="3" rx="2"/>
  <!-- Rack Mounting Rails (Left and Right) -->
  <rect x="70" y="70" width="22" height="600" fill="#1E293B"/>
  <rect x="408" y="70" width="22" height="600" fill="#1E293B"/>

  <!-- U Numbers Indicators (Every 5U) -->
  <text x="81" y="90" font-family="JetBrains Mono, monospace" font-size="7" fill="#64748B" text-anchor="middle">42</text>
  <text x="81" y="160" font-family="JetBrains Mono, monospace" font-size="7" fill="#64748B" text-anchor="middle">38</text>
  <text x="81" y="230" font-family="JetBrains Mono, monospace" font-size="7" fill="#64748B" text-anchor="middle">32</text>
  <text x="81" y="300" font-family="JetBrains Mono, monospace" font-size="7" fill="#64748B" text-anchor="middle">24</text>
  <text x="81" y="380" font-family="JetBrains Mono, monospace" font-size="7" fill="#64748B" text-anchor="middle">18</text>
  <text x="81" y="460" font-family="JetBrains Mono, monospace" font-size="7" fill="#64748B" text-anchor="middle">12</text>
  <text x="81" y="550" font-family="JetBrains Mono, monospace" font-size="7" fill="#64748B" text-anchor="middle">06</text>
  <text x="81" y="630" font-family="JetBrains Mono, monospace" font-size="7" fill="#64748B" text-anchor="middle">01</text>

  <!-- 1. Cable Management and Fiber Patch (U41-42) -->
  <rect x="94" y="80" width="312" height="32" fill="#1E293B" stroke="#334155"/>
  <text x="105" y="100" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#38BDF8">48-PORT CAT6A PATCH PANEL (VOICE/DATA)</text>

  <!-- 2. Core 10GbE SFP+ Aggregation Switch (U39-40) -->
  <rect x="94" y="116" width="312" height="36" fill="#0C4A6E" stroke="#0284C7"/>
  <circle cx="106" cy="134" r="3" fill="#10B981"/>
  <text x="118" y="138" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#FFFFFF">TOP-OF-RACK 10G SFP+ AGGREGATION</text>
  <g transform="translate(300, 126)">
    <rect x="0" y="0" width="12" height="16" fill="#0F172A" stroke="#38BDF8"/><circle cx="6" cy="4" r="1.5" fill="#10B981"/>
    <rect x="15" y="0" width="12" height="16" fill="#0F172A" stroke="#38BDF8"/><circle cx="21" cy="4" r="1.5" fill="#10B981"/>
    <rect x="30" y="0" width="12" height="16" fill="#0F172A" stroke="#38BDF8"/><circle cx="36" cy="4" r="1.5" fill="#10B981"/>
    <rect x="45" y="0" width="12" height="16" fill="#0F172A" stroke="#38BDF8"/><circle cx="51" cy="4" r="1.5" fill="#10B981"/>
    <rect x="60" y="0" width="12" height="16" fill="#0F172A" stroke="#38BDF8"/><circle cx="66" cy="4" r="1.5" fill="#10B981"/>
    <rect x="75" y="0" width="12" height="16" fill="#0F172A" stroke="#38BDF8"/><circle cx="81" cy="4" r="1.5" fill="#10B981"/>
  </g>

  <!-- 3. Redundant Perimeter Next-Gen Firewall (U37-38) -->
  <rect x="94" y="156" width="312" height="36" fill="#1E1B4B" stroke="#6366F1"/>
  <circle cx="106" cy="174" r="3" fill="#10B981"/>
  <text x="118" y="178" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#A5B4FC">HA NEXT-GEN PERIMETER FIREWALL CLUSTER</text>

  <!-- 4. Blanking Panel -->
  <rect x="94" y="196" width="312" height="24" fill="#0B132B" stroke="#1E293B"/>
  <text x="250" y="211" font-family="JetBrains Mono, monospace" font-size="8" fill="#475569" text-anchor="middle">// 2U AIRFLOW MANAGEMENT BAFFLE //</text>

  <!-- 5. Node 01: 2U Enterprise Hypervisor Server (U32-34) -->
  <rect x="94" y="224" width="312" height="54" fill="#132338" stroke="#0052CC" stroke-width="1.5"/>
  <circle cx="106" cy="251" r="3" fill="#10B981"/>
  <text x="118" y="246" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#FFFFFF">HOST 01: VMWARE ESXi / HYPER-V CLUSTER</text>
  <text x="118" y="262" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#94A3B8">2x AMD EPYC 32C &#8226; 512GB RAM &#8226; 4x 10GbE</text>

  <!-- 6. Node 02: 2U Enterprise Hypervisor Server (U29-31) -->
  <rect x="94" y="282" width="312" height="54" fill="#132338" stroke="#0052CC" stroke-width="1.5"/>
  <circle cx="106" cy="309" r="3" fill="#10B981"/>
  <text x="118" y="304" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#FFFFFF">HOST 02: VMWARE ESXi / HYPER-V CLUSTER</text>
  <text x="118" y="320" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#94A3B8">2x AMD EPYC 32C &#8226; 512GB RAM &#8226; 4x 10GbE</text>

  <!-- 7. Blanking Panel -->
  <rect x="94" y="340" width="312" height="20" fill="#0B132B" stroke="#1E293B"/>

  <!-- 8. Shared All-Flash NVMe SAN Storage Array (U23-26) -->
  <rect x="94" y="364" width="312" height="72" fill="#1E293B" stroke="#0284C7" stroke-width="2"/>
  <text x="108" y="386" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#38BDF8">24-BAY DUAL-CONTROLLER ALL-FLASH SAN</text>
  <!-- Drive Row Visual -->
  <g transform="translate(108, 396)">
    <rect x="0" y="0" width="16" height="30" fill="#0F172A" stroke="#334155"/><circle cx="8" cy="6" r="2" fill="#10B981"/>
    <rect x="19" y="0" width="16" height="30" fill="#0F172A" stroke="#334155"/><circle cx="27" cy="6" r="2" fill="#10B981"/>
    <rect x="38" y="0" width="16" height="30" fill="#0F172A" stroke="#334155"/><circle cx="46" cy="6" r="2" fill="#10B981"/>
    <rect x="57" y="0" width="16" height="30" fill="#0F172A" stroke="#334155"/><circle cx="65" cy="6" r="2" fill="#10B981"/>
    <rect x="76" y="0" width="16" height="30" fill="#0F172A" stroke="#334155"/><circle cx="84" cy="6" r="2" fill="#10B981"/>
    <rect x="95" y="0" width="16" height="30" fill="#0F172A" stroke="#334155"/><circle cx="103" cy="6" r="2" fill="#10B981"/>
    <rect x="114" y="0" width="16" height="30" fill="#0F172A" stroke="#334155"/><circle cx="122" cy="6" r="2" fill="#10B981"/>
    <rect x="133" y="0" width="16" height="30" fill="#0F172A" stroke="#334155"/><circle cx="141" cy="6" r="2" fill="#10B981"/>
    <rect x="152" y="0" width="16" height="30" fill="#0F172A" stroke="#334155"/><circle cx="160" cy="6" r="2" fill="#10B981"/>
    <rect x="171" y="0" width="16" height="30" fill="#0F172A" stroke="#334155"/><circle cx="179" cy="6" r="2" fill="#10B981"/>
    <rect x="190" y="0" width="16" height="30" fill="#0F172A" stroke="#334155"/><circle cx="198" cy="6" r="2" fill="#10B981"/>
    <rect x="209" y="0" width="16" height="30" fill="#0F172A" stroke="#334155"/><circle cx="217" cy="6" r="2" fill="#10B981"/>
    <rect x="228" y="0" width="16" height="30" fill="#0F172A" stroke="#334155"/><circle cx="236" cy="6" r="2" fill="#10B981"/>
    <rect x="247" y="0" width="16" height="30" fill="#0F172A" stroke="#334155"/><circle cx="255" cy="6" r="2" fill="#10B981"/>
    <rect x="266" y="0" width="16" height="30" fill="#0F172A" stroke="#334155"/><circle cx="274" cy="6" r="2" fill="#10B981"/>
  </g>

  <!-- 9. Secondary Immutable Backup Appliance (U17-20) -->
  <rect x="94" y="440" width="312" height="60" fill="#132338" stroke="#10B981" stroke-width="1.5"/>
  <circle cx="106" cy="470" r="3" fill="#10B981"/>
  <text x="118" y="465" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#FFFFFF">HARDENED IMMUTABLE BACKUP REPOSITORY</text>
  <text x="118" y="481" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#94A3B8">Air-Gapped Linux Repo &#8226; Ransomware-Proof Object Lock</text>

  <!-- 10. Blanking Panels (U7-16) -->
  <rect x="94" y="504" width="312" height="40" fill="#0B132B" stroke="#1E293B"/>
  <text x="250" y="528" font-family="JetBrains Mono, monospace" font-size="8" fill="#475569" text-anchor="middle">// EXPANSION BAYS // RESERVED FOR EXPANSION //</text>

  <!-- 11. Dual Online Double-Conversion UPS (U1-6) -->
  <rect x="94" y="548" width="312" height="52" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <circle cx="106" cy="574" r="3" fill="#10B981"/>
  <text x="118" y="570" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" fill="#FDE68A">UPS-A: 3000VA ONLINE DOUBLE-CONVERSION</text>
  <text x="118" y="586" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#94A3B8">FEED: UTILITY 120V/30A &#8226; RUNTIME: 45 MIN NOMINAL</text>

  <rect x="94" y="604" width="312" height="52" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <circle cx="106" cy="630" r="3" fill="#10B981"/>
  <text x="118" y="626" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" fill="#FDE68A">UPS-B: 3000VA ONLINE DOUBLE-CONVERSION</text>
  <text x="118" y="642" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#94A3B8">FEED: GENERATOR ISOLATED &#8226; REDUNDANT ATS</text>
