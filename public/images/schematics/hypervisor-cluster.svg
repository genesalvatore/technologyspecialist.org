<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" style="background:#0F172A;">
  <defs>
    <pattern id="grid-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="blue-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0052CC"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Technical Background Grid -->
  <rect width="800" height="500" fill="url(#grid-pattern)"/>

  <!-- Telemetry Header Bar -->
  <rect x="20" y="20" width="760" height="36" fill="#1E293B" rx="1"/>
  <text x="35" y="42" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#38BDF8">SYS-02 // HA HYPERVISOR CLUSTER FABRIC</text>
  <text x="500" y="42" font-family="JetBrains Mono, monospace" font-size="11" fill="#94A3B8">VMWARE ESXi 8.0 &bull; HYPER-V CLUSTER</text>
  <circle cx="755" cy="38" r="4" fill="#10B981"/>

  <!-- Cluster Node 01 Box -->
  <rect x="50" y="80" width="310" height="190" fill="#132338" stroke="#0284C7" stroke-width="1.5" rx="2"/>
  <rect x="50" y="80" width="310" height="28" fill="#0C4A6E"/>
  <text x="65" y="99" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#FFFFFF">NODE 01: HOST-PRIMARY [ACTIVE]</text>
  <text x="65" y="128" font-family="JetBrains Mono, monospace" font-size="10" fill="#94A3B8">CPU: 2x AMD EPYC 32-CORE | RAM: 512GB ECC</text>
  <text x="65" y="145" font-family="JetBrains Mono, monospace" font-size="10" fill="#94A3B8">NIC: 4x 10GbE SFP+ LACP BOND (TEAM 0)</text>

  <!-- Node 01 VMs -->
  <rect x="65" y="160" width="85" height="42" fill="#0F172A" stroke="#38BDF8" stroke-width="1" rx="1"/>
  <text x="73" y="177" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#E2E8F0">VM-DC01</text>
  <text x="73" y="193" font-family="JetBrains Mono, monospace" font-size="8" fill="#10B981">&bull; ACTIVE DC</text>

  <rect x="160" y="160" width="85" height="42" fill="#0F172A" stroke="#38BDF8" stroke-width="1" rx="1"/>
  <text x="168" y="177" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#E2E8F0">VM-SQL01</text>
  <text x="168" y="193" font-family="JetBrains Mono, monospace" font-size="8" fill="#10B981">&bull; PROD DB</text>

  <rect x="255" y="160" width="85" height="42" fill="#0F172A" stroke="#38BDF8" stroke-width="1" rx="1"/>
  <text x="263" y="177" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#E2E8F0">VM-APP01</text>
  <text x="263" y="193" font-family="JetBrains Mono, monospace" font-size="8" fill="#10B981">&bull; RUNTIME</text>

  <rect x="65" y="212" width="275" height="42" fill="#0B132B" stroke="#1E293B" rx="1"/>
  <text x="75" y="230" font-family="JetBrains Mono, monospace" font-size="9" fill="#38BDF8">STATUS: 12 VMs ONLINE | CPU LOAD 18% | RAM 42%</text>
  <text x="75" y="244" font-family="JetBrains Mono, monospace" font-size="9" fill="#10B981">&bull; VMOTION READY | HEARTBEAT SYNC NOMINAL</text>

  <!-- Cluster Node 02 Box -->
  <rect x="440" y="80" width="310" height="190" fill="#132338" stroke="#0284C7" stroke-width="1.5" rx="2"/>
  <rect x="440" y="80" width="310" height="28" fill="#0C4A6E"/>
  <text x="455" y="99" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#FFFFFF">NODE 02: HOST-SECONDARY [ACTIVE]</text>
  <text x="455" y="128" font-family="JetBrains Mono, monospace" font-size="10" fill="#94A3B8">CPU: 2x AMD EPYC 32-CORE | RAM: 512GB ECC</text>
  <text x="455" y="145" font-family="JetBrains Mono, monospace" font-size="10" fill="#94A3B8">NIC: 4x 10GbE SFP+ LACP BOND (TEAM 0)</text>

  <!-- Node 02 VMs -->
  <rect x="455" y="160" width="85" height="42" fill="#0F172A" stroke="#38BDF8" stroke-width="1" rx="1"/>
  <text x="463" y="177" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#E2E8F0">VM-DC02</text>
  <text x="463" y="193" font-family="JetBrains Mono, monospace" font-size="8" fill="#10B981">&bull; SECONDARY</text>

  <rect x="550" y="160" width="85" height="42" fill="#0F172A" stroke="#38BDF8" stroke-width="1" rx="1"/>
  <text x="558" y="177" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#E2E8F0">VM-RDS01</text>
  <text x="558" y="193" font-family="JetBrains Mono, monospace" font-size="8" fill="#10B981">&bull; RDS FARM</text>

  <rect x="645" y="160" width="85" height="42" fill="#0F172A" stroke="#38BDF8" stroke-width="1" rx="1"/>
  <text x="653" y="177" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#E2E8F0">VM-PBX01</text>
  <text x="653" y="193" font-family="JetBrains Mono, monospace" font-size="8" fill="#10B981">&bull; VOICE CORE</text>

  <rect x="455" y="212" width="275" height="42" fill="#0B132B" stroke="#1E293B" rx="1"/>
  <text x="465" y="230" font-family="JetBrains Mono, monospace" font-size="9" fill="#38BDF8">STATUS: 14 VMs ONLINE | CPU LOAD 22% | RAM 46%</text>
  <text x="465" y="244" font-family="JetBrains Mono, monospace" font-size="9" fill="#10B981">&bull; AUTO-FAILOVER STANDBY | ZERO VM DOWNTIME</text>

  <!-- Inter-Host HA Heartbeat & vMotion Bus -->
  <line x1="360" y1="175" x2="440" y2="175" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 3"/>
  <polygon points="395,170 405,175 395,180" fill="#38BDF8"/>
  <rect x="365" y="152" width="70" height="18" fill="#0284C7" rx="1"/>
  <text x="400" y="164" font-family="JetBrains Mono, monospace" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">10G vMOTION</text>

  <!-- Redundant Storage Fabric Bus -->
  <path d="M 205 270 L 205 340 L 400 340" stroke="#0052CC" stroke-width="2.5" fill="none"/>
  <path d="M 595 270 L 595 340 L 400 340" stroke="#0052CC" stroke-width="2.5" fill="none"/>
  <circle cx="400" cy="340" r="5" fill="#38BDF8"/>

  <!-- Shared All-Flash NVMe / iSCSI SAN Storage Array -->
  <rect x="180" y="360" width="440" height="110" fill="#1E293B" stroke="#0052CC" stroke-width="2" rx="2"/>
  <rect x="180" y="360" width="440" height="26" fill="#0F172A"/>
  <text x="200" y="377" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#38BDF8">SHARED STORAGE FABRIC // DUAL-CONTROLLER ALL-FLASH SAN</text>

  <!-- Drive Bays Visual -->
  <g transform="translate(200, 396)">
    <rect x="0" y="0" width="30" height="60" fill="#0F172A" stroke="#334155"/><circle cx="15" cy="12" r="3" fill="#10B981"/>
    <rect x="34" y="0" width="30" height="60" fill="#0F172A" stroke="#334155"/><circle cx="49" cy="12" r="3" fill="#10B981"/>
    <rect x="68" y="0" width="30" height="60" fill="#0F172A" stroke="#334155"/><circle cx="83" cy="12" r="3" fill="#10B981"/>
    <rect x="102" y="0" width="30" height="60" fill="#0F172A" stroke="#334155"/><circle cx="117" cy="12" r="3" fill="#10B981"/>
    <rect x="136" y="0" width="30" height="60" fill="#0F172A" stroke="#334155"/><circle cx="151" cy="12" r="3" fill="#10B981"/>
    <rect x="170" y="0" width="30" height="60" fill="#0F172A" stroke="#334155"/><circle cx="185" cy="12" r="3" fill="#10B981"/>
  </g>

  <!-- Storage Telemetry -->
  <text x="430" y="415" font-family="JetBrains Mono, monospace" font-size="10" fill="#E2E8F0">ARRAY: 48TB RAW NVMe RAID 10</text>
  <text x="430" y="432" font-family="JetBrains Mono, monospace" font-size="10" fill="#94A3B8">THROUGHPUT: 125,000 IOPS @ 0.4ms</text>
  <text x="430" y="449" font-family="JetBrains Mono, monospace" font-size="10" fill="#10B981">&bull; ACTIVE-ACTIVE MP-IO MULTIPATHING</text>
</svg>
